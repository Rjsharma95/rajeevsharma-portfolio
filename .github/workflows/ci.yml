name: Portfolio CI

on:
    push:
        branches:
            - main
            - "feature/**"
            - "fix/**"
            - "update/**"
        
    pull_request:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Lint and Build
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository 
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Build application
              run: npm run build
